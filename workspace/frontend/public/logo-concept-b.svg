<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 主渐变：冰蓝 → 赛博紫 -->
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="40%" stop-color="#00BCD4"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="chipGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="bgGrad2" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
  </defs>

  <!-- 背景 -->
  <rect width="512" height="512" rx="72" fill="url(#bgGrad2)"/>

  <!-- 芯片外框 - 正方形芯片轮廓（旋转45度变菱形） -->
  <g transform="translate(256, 240)">
    <!-- 外部芯片引脚 -->
    <!-- 上方引脚 -->
    <line x1="-50" y1="-120" x2="-50" y2="-145" stroke="#00BCD4" stroke-width="2" opacity="0.5"/>
    <line x1="-20" y1="-120" x2="-20" y2="-150" stroke="#00BCD4" stroke-width="2" opacity="0.4"/>
    <line x1="20" y1="-120" x2="20" y2="-150" stroke="#00BCD4" stroke-width="2" opacity="0.4"/>
    <line x1="50" y1="-120" x2="50" y2="-145" stroke="#00BCD4" stroke-width="2" opacity="0.5"/>
    <!-- 下方引脚 -->
    <line x1="-50" y1="120" x2="-50" y2="145" stroke="#7C3AED" stroke-width="2" opacity="0.5"/>
    <line x1="-20" y1="120" x2="-20" y2="150" stroke="#7C3AED" stroke-width="2" opacity="0.4"/>
    <line x1="20" y1="120" x2="20" y2="150" stroke="#7C3AED" stroke-width="2" opacity="0.4"/>
    <line x1="50" y1="120" x2="50" y2="145" stroke="#7C3AED" stroke-width="2" opacity="0.5"/>
    <!-- 左侧引脚 -->
    <line x1="-120" y1="-50" x2="-145" y2="-50" stroke="#00E5FF" stroke-width="2" opacity="0.5"/>
    <line x1="-120" y1="-20" x2="-150" y2="-20" stroke="#00E5FF" stroke-width="2" opacity="0.4"/>
    <line x1="-120" y1="20" x2="-150" y2="20" stroke="#00E5FF" stroke-width="2" opacity="0.4"/>
    <line x1="-120" y1="50" x2="-145" y2="50" stroke="#00E5FF" stroke-width="2" opacity="0.5"/>
    <!-- 右侧引脚 -->
    <line x1="120" y1="-50" x2="145" y2="-50" stroke="#8B5CF6" stroke-width="2" opacity="0.5"/>
    <line x1="120" y1="-20" x2="150" y2="-20" stroke="#8B5CF6" stroke-width="2" opacity="0.4"/>
    <line x1="120" y1="20" x2="150" y2="20" stroke="#8B5CF6" stroke-width="2" opacity="0.4"/>
    <line x1="120" y1="50" x2="145" y2="50" stroke="#8B5CF6" stroke-width="2" opacity="0.5"/>

    <!-- 芯片主体框 -->
    <rect x="-120" y="-120" width="240" height="240" rx="16" fill="none" stroke="url(#chipGrad)" stroke-width="2.5" opacity="0.8"/>
    <!-- 内框 -->
    <rect x="-95" y="-95" width="190" height="190" rx="8" fill="none" stroke="url(#chipGrad)" stroke-width="1" opacity="0.3" stroke-dasharray="4,4"/>

    <!-- 鲸鱼剪影 - 在芯片内部 -->
    <g filter="url(#neonGlow)">
      <path d="M -70 10 
               C -55 -30, -20 -50, 15 -48 
               C 40 -46, 58 -38, 70 -25 
               C 78 -15, 82 0, 78 12
               C 72 28, 55 38, 35 42
               C 10 46, -15 44, -35 38
               C -52 32, -65 22, -70 10Z" 
            fill="url(#chipGrad)" opacity="0.15"/>
      <path d="M -70 10 
               C -55 -30, -20 -50, 15 -48 
               C 40 -46, 58 -38, 70 -25 
               C 78 -15, 82 0, 78 12
               C 72 28, 55 38, 35 42
               C 10 46, -15 44, -35 38
               C -52 32, -65 22, -70 10Z" 
            fill="none" stroke="url(#chipGrad)" stroke-width="2.5"/>
    </g>

    <!-- 鲸鱼尾鳍 -->
    <g filter="url(#softGlow)">
      <path d="M 70 -25 C 80 -40, 92 -52, 98 -60 C 100 -63, 102 -60, 100 -55 C 95 -45, 87 -33, 75 -22" 
            fill="none" stroke="url(#chipGrad)" stroke-width="2" opacity="0.9"/>
      <path d="M 78 12 C 88 22, 95 35, 100 45 C 102 48, 100 50, 97 47 C 92 40, 85 28, 76 16" 
            fill="none" stroke="url(#chipGrad)" stroke-width="2" opacity="0.9"/>
    </g>

    <!-- 鲸鱼眼睛 -->
    <circle cx="-48" cy="4" r="4" fill="#00F5FF" filter="url(#neonGlow)"/>
    <circle cx="-48" cy="4" r="1.5" fill="#FFFFFF"/>

    <!-- 胸鳍 -->
    <path d="M 0 42 C 5 55, 0 65, -8 68 C -12 69, -12 66, -8 60 C -2 50, 0 45, -1 40" 
          fill="none" stroke="url(#chipGrad)" stroke-width="1.5" opacity="0.7"/>

    <!-- 声波弧线 - 从鲸鱼嘴部 -->
    <g filter="url(#softGlow)">
      <path d="M -78 0 Q -88 10 -78 20" fill="none" stroke="#00E5FF" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      <path d="M -85 -8 Q -98 10 -85 28" fill="none" stroke="#00D4FF" stroke-width="1.2" stroke-linecap="round" opacity="0.45"/>
      <path d="M -92 -15 Q -108 10 -92 35" fill="none" stroke="#00B4FF" stroke-width="1" stroke-linecap="round" opacity="0.3"/>
    </g>

    <!-- 内部电路线条连接各个"核心" -->
    <g opacity="0.4">
      <line x1="-95" y1="-80" x2="-70" y2="-50" stroke="#00BCD4" stroke-width="0.8"/>
      <line x1="95" y1="-80" x2="70" y2="-45" stroke="#8B5CF6" stroke-width="0.8"/>
      <line x1="-95" y1="80" x2="-50" y2="30" stroke="#00BCD4" stroke-width="0.8"/>
      <line x1="95" y1="80" x2="60" y2="30" stroke="#8B5CF6" stroke-width="0.8"/>
    </g>

    <!-- 角落小节点 -->
    <circle cx="-95" cy="-80" r="2.5" fill="#00E5FF" opacity="0.6" filter="url(#softGlow)"/>
    <circle cx="95" cy="-80" r="2.5" fill="#8B5CF6" opacity="0.6" filter="url(#softGlow)"/>
    <circle cx="-95" cy="80" r="2.5" fill="#00E5FF" opacity="0.6" filter="url(#softGlow)"/>
    <circle cx="95" cy="80" r="2.5" fill="#8B5CF6" opacity="0.6" filter="url(#softGlow)"/>
  </g>

  <!-- 52Hz 文字 -->
  <text x="256" y="425" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="32" font-weight="700" letter-spacing="4" fill="url(#chipGrad)" filter="url(#softGlow)">52Hz</text>
  <text x="256" y="455" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" font-weight="400" letter-spacing="8" fill="#475569" text-transform="uppercase">AGENTS</text>
</svg>
